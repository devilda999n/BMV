name: Ashish Browser Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Ashish Browser
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch Iceraven
        run: ./automation/iceraven/patch_android_components.sh

      - name: Inject Ashish VPN config
        env:
          ASHISH_WG_CONFIG: ${{ secrets.ASHISH_WG_CONFIG }}
        run: |
          test -n "$ASHISH_WG_CONFIG"
          mkdir -p app/src/main/res/raw
          printf '%s\n' "$ASHISH_WG_CONFIG" > app/src/main/res/raw/ashish_wg.conf

      - name: Apply Ashish customizations
        run: |
          chmod +x automation/iceraven/ashish_customizations.sh
          ./automation/iceraven/ashish_customizations.sh

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Configure signing
        run: echo "autosignReleaseWithDebugKey=" >> local.properties

      - name: Build Ashish Browser
        run: ./gradlew app:assembleForkRelease -PversionName="1.0.0"

      - name: Sign Ashish APKs
        run: |
          keytool -genkeypair -noprompt \
            -keystore ashish-debug.jks \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias ashish \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ashish Browser,O=Personal,C=IN"

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)

          for apk in gradle/build/app/outputs/apk/forkRelease/*-unsigned.apk; do
            output="${apk%-unsigned.apk}.apk"

            "$APKSIGNER" sign \
              --ks ashish-debug.jks \
              --ks-key-alias ashish \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              "$apk"

            "$APKSIGNER" verify "$output"
          done

      - name: Upload Ashish APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashish-Browser-APK
          path: gradle/build/app/outputs/apk/forkRelease/app-*-forkRelease.apk
          if-no-files-found: error
